name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: credential material deleted from HEAD is still in the
          # object database and still reachable.
          fetch-depth: 0

      # Both scans read tracked files only, so anything the .gitignore keeps out
      # of the repository is out of scope here as well. `-I` skips binary blobs,
      # whose only meaningful review is opening them; the binaries here are
      # screenshots and a GIF.
      - name: Scan tracked files for credential material
        run: |
          if git grep -I -inE "$SECRET_PATTERN" -- . ; then
            echo "::error::Possible credential material in the working tree."
            exit 1
          fi
          echo "Working tree clean."
        env:
          SECRET_PATTERN: >-
            BEGIN [A-Z ]*PRIVATE KEY|(password|passwd|pwd|secret|api[-_]?key|access[-_]?key|auth[-_]?token|connection[-_]?string)[[:space:]]*[=:][[:space:]]*.?[A-Za-z0-9/+=_.-]{8,}

      - name: Scan every blob in every commit
        run: |
          if git grep -I -inE "$SECRET_PATTERN" $(git rev-list --all) ; then
            echo "::error::Possible credential material in git history."
            exit 1
          fi
          echo "History clean."
        env:
          SECRET_PATTERN: >-
            BEGIN [A-Z ]*PRIVATE KEY|(password|passwd|pwd|secret|api[-_]?key|access[-_]?key|auth[-_]?token|connection[-_]?string)[[:space:]]*[=:][[:space:]]*.?[A-Za-z0-9/+=_.-]{8,}

      # Key and keystore extensions have no business being tracked: the
      # application instance certificate is generated on first run.
      - name: Assert no key material is tracked
        run: |
          if git ls-files | grep -iE '\.(pfx|p12|pem|key|jks|keystore)$' ; then
            echo "::error::Key material is tracked in this repository."
            exit 1
          fi
          echo "No tracked key material, as intended."

      - name: Assert no private package feed
        run: |
          if find . -iname 'nuget.config' -not -path './.git/*' | grep . ; then
            echo "::error::A NuGet.config exists. This repository restores from nuget.org only."
            exit 1
          fi
          echo "No NuGet.config, as intended."

  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # A restore that succeeds on a clean runner with no NuGet.config is the
      # proof that every dependency is publicly available.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  web:
    name: dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`: it fails on a lockfile that does not
      # match package.json, which is the point of running it here.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Proves the compose file and Dockerfile have not rotted. Nothing is
      # pushed anywhere.
      - name: Build images
        run: docker compose build

      - name: Validate compose file
        run: docker compose config --quiet
